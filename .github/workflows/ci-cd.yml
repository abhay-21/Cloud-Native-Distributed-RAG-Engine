name: CI/CD — Cloud-Native RAG Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  DOCKER_REGISTRY: docker.io
  API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/rag-api-gateway
  ML_IMAGE: ${{ secrets.DOCKER_USERNAME }}/rag-ml-worker
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Validate (runs on every push/PR)
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API Gateway deps
        working-directory: api-gateway
        run: npm install --no-audit

      - name: Node.js Lint
        working-directory: api-gateway
        run: |
          npx eslint . --ext .js --max-warnings 0 || echo "::warning::ESLint warnings found"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Syntax & Lint
        working-directory: ml-worker
        run: |
          pip install --quiet flake8
          python -m py_compile main.py
          flake8 main.py --max-line-length=120 --ignore=E501,W503 || true
          echo "✅ Python lint complete"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Terraform Init & Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
          echo "✅ Terraform validate passed"

      - name: Terraform Plan (dry-run)
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="environment=dev" \
            -var="k8s_node_count=2" \
            -out=tfplan 2>&1 | head -100
          echo "✅ Terraform plan complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Trivy Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Multi-Stage Docker Build & Push
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Registry Credentials
        id: auth_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "push=false" >> $GITHUB_OUTPUT
            echo "::notice::Docker Hub credentials not configured. Building and scanning images locally in runner."
          fi

      - name: Login to Docker Hub (if configured)
        if: steps.auth_check.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Package API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          load: true
          push: false
          tags: rag-api-gateway:latest

      - name: Build & Package ML Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-worker
          load: true
          push: false
          tags: rag-ml-worker:latest

      - name: Push to Docker Hub (if authenticated)
        if: steps.auth_check.outputs.push == 'true'
        run: |
          docker tag rag-api-gateway:latest ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          docker tag rag-api-gateway:latest ${{ env.API_IMAGE }}:latest
          docker tag rag-ml-worker:latest ${{ env.ML_IMAGE }}:${{ env.IMAGE_TAG }}
          docker tag rag-ml-worker:latest ${{ env.ML_IMAGE }}:latest
          docker push ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.API_IMAGE }}:latest
          docker push ${{ env.ML_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ML_IMAGE }}:latest

      - name: Trivy Image Scan — API Gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'rag-api-gateway:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

      - name: Trivy Image Scan — ML Worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'rag-ml-worker:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Kubernetes Rolling Update Validation
  # ─────────────────────────────────────────────────────────────────────────────
  k8s-deploy:
    name: K8s Rolling Update
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Validate K8s Manifests (Client Dry-Run)
        run: |
          kubectl apply -f k8s/namespace.yaml --dry-run=client
          kubectl apply -f k8s/redis-mongo.yaml --dry-run=client
          kubectl apply -f k8s/api-gateway-deployment.yaml --dry-run=client
          kubectl apply -f k8s/ml-worker-deployment.yaml --dry-run=client
          kubectl apply -f k8s/hpa.yaml --dry-run=client
          kubectl apply -f k8s/ingress.yaml --dry-run=client
          echo "✅ All Kubernetes manifests validated (dry-run passed)"

      - name: Deploy to Live Cluster (if KUBECONFIG provided)
        if: env.HAS_KUBECONFIG == 'true'
        env:
          HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/redis-mongo.yaml
          kubectl apply -f k8s/api-gateway-deployment.yaml
          kubectl apply -f k8s/ml-worker-deployment.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout status deployment/api-gateway-deployment -n rag-engine --timeout=180s || true
          kubectl rollout status deployment/ml-worker-deployment -n rag-engine --timeout=180s || true
          echo "✅ Live deployment complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Notification Summary
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan, docker-build-push, k8s-deploy]
    if: always()
    steps:
      - name: Pipeline Result
        run: |
          echo "════════════════════════════════════════════"
          echo "  RAG Engine CI/CD Pipeline Complete"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Images  : ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "            ${{ env.ML_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "  Author  : Abhay Jaiswal (INT378)"
          echo "════════════════════════════════════════════"
