apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # CRITICAL: panels reference this exact UID
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
      httpMethod: POST
      manageAlerts: false
