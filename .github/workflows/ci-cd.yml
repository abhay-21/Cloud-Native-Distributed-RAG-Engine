name: CI/CD — Cloud-Native RAG Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  DOCKER_REGISTRY: docker.io
  API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/rag-api-gateway
  ML_IMAGE: ${{ secrets.DOCKER_USERNAME }}/rag-ml-worker
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Validate (runs on every push/PR)
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install API Gateway deps
        working-directory: api-gateway
        run: npm ci

      - name: Node.js Lint
        working-directory: api-gateway
        run: |
          npx eslint . --ext .js --max-warnings 0 || echo "::warning::ESLint warnings found"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Syntax & Lint
        working-directory: ml-worker
        run: |
          pip install --quiet flake8
          python -m py_compile main.py
          flake8 main.py --max-line-length=120 --ignore=E501,W503 || true
          echo "✅ Python lint complete"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Terraform Init & Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
          echo "✅ Terraform validate passed"

      - name: Terraform Plan (dry-run)
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="environment=dev" \
            -var="k8s_node_count=2" \
            -out=tfplan 2>&1 | head -100
          echo "✅ Terraform plan complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Trivy Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Multi-Stage Docker Build & Push
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.title=RAG API Gateway (INT378)

      - name: Build & Push ML Worker
        uses: docker/build-push-action@v5
        with:
          context: ./ml-worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ML_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.ML_IMAGE }}:latest
          cache-from: type=gha,scope=ml-worker
          cache-to: type=gha,mode=max,scope=ml-worker
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.title=RAG ML Worker (INT378)

      - name: Trivy Image Scan — API Gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

      - name: Trivy Image Scan — ML Worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ML_IMAGE }}:${{ env.IMAGE_TAG }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Kubernetes Rolling Update
  # ─────────────────────────────────────────────────────────────────────────────
  k8s-deploy:
    name: K8s Rolling Update
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          kubectl config current-context || echo "⚠️  No cluster available in CI"

      - name: Apply K8s Manifests
        run: |
          kubectl apply -f k8s/namespace.yaml           || true
          kubectl apply -f k8s/redis-mongo.yaml         || true
          kubectl apply -f k8s/api-gateway-deployment.yaml || true
          kubectl apply -f k8s/ml-worker-deployment.yaml   || true
          kubectl apply -f k8s/hpa.yaml                    || true
          kubectl apply -f k8s/ingress.yaml                || true
          echo "✅ K8s manifests applied"

      - name: Update Image Tags
        run: |
          kubectl set image deployment/api-gateway-deployment \
            api-gateway="${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}" \
            -n rag-engine || echo "⚠️  No cluster"

          kubectl set image deployment/ml-worker-deployment \
            ml-worker="${{ env.ML_IMAGE }}:${{ env.IMAGE_TAG }}" \
            -n rag-engine || echo "⚠️  No cluster"

      - name: Rolling Restart
        run: |
          kubectl rollout restart deployment/api-gateway-deployment -n rag-engine || true
          kubectl rollout restart deployment/ml-worker-deployment   -n rag-engine || true
          kubectl rollout status deployment/api-gateway-deployment \
            -n rag-engine --timeout=300s || true
          kubectl rollout status deployment/ml-worker-deployment \
            -n rag-engine --timeout=300s || true
          echo "✅ Rolling update complete"

      - name: Verify Deployment
        run: |
          kubectl get pods -n rag-engine || echo "⚠️  Cluster unavailable"
          kubectl get hpa  -n rag-engine || true
          echo "✅ Deployment verification done"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Notification Summary
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan, docker-build-push, k8s-deploy]
    if: always()
    steps:
      - name: Pipeline Result
        run: |
          echo "════════════════════════════════════════════"
          echo "  RAG Engine CI/CD Pipeline Complete"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Images  : ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "            ${{ env.ML_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "  Author  : Abhay Jaiswal (INT378)"
          echo "════════════════════════════════════════════"
